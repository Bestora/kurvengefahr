server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Hashed build output: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        # nginx's mime.types lacks .mjs; served as octet-stream, the browser refuses the pdf.js worker.
        location ~ \.mjs$ {
            types { application/javascript mjs; }
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    # App shell + service worker must revalidate, or PWA updates never arrive.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
