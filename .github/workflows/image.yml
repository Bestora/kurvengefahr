name: Container image

# Self-hosting: every push to main builds the app (Rust → WASM + Vite) and pushes an nginx image
# to ghcr.io/<owner>/kurvengefahr:latest. A host like Coolify then only pulls it. Set the repo
# variable SHARE_API_URL to compile sharing in; set the secrets COOLIFY_WEBHOOK (the resource's
# deploy webhook URL) and COOLIFY_TOKEN (an API token) to redeploy automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - run: npm ci
      - run: npm run build
        env:
          VITE_SHARE_API_URL: ${{ vars.SHARE_API_URL }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (GHCR needs lowercase)
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kurvengefahr" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.ref }}:latest
            ${{ steps.name.outputs.ref }}:${{ github.sha }}

      - name: Redeploy on Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          [ -n "$COOLIFY_WEBHOOK" ] || { echo "COOLIFY_WEBHOOK not set - skipping redeploy"; exit 0; }
          curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
